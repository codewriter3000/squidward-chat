name: Build

on:
  push:
    branches:
      - production

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: priv/static/
          if-no-files-found: error
          retention-days: 1

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          rebar3-version: '3.23'

      - name: Cache rebar3 dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rebar3
            _build
          key: rebar3-${{ hashFiles('rebar.config') }}
          restore-keys: rebar3-

      - name: Compile and release
        run: rebar3 as prod release

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend
          path: _build/prod/rel/squidward_chat/
          if-no-files-found: error
          retention-days: 1

  trigger-deployment:
    name: Trigger On-Prem Deployment
    needs: [build-frontend, build-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to onprem-deployment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DEPLOY_PAT }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'codewriter3000',
              repo: 'onprem-deployment',
              event_type: 'squidward-chat-build',
              client_payload: {
                repository: '${{ github.repository }}',
                run_id: '${{ github.run_id }}',
                sha: '${{ github.sha }}'
              }
            });
